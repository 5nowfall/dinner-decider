<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dinner Decider</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo" aria-hidden="true">🍽️</span><h1>Dinner Decider</h1></div>
    <nav id="nav" aria-label="Sections">
      <button type="button" data-tab="tonight">Tonight</button>
      <button type="button" data-tab="week">Week</button>
      <button type="button" data-tab="saved">Saved</button>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <section id="timers" aria-label="Cooking timers">
    <ul id="tlist"></ul>
    <form id="quick" autocomplete="off">
      <label for="quickMin">⏱ Quick timer</label>
      <input id="quickMin" type="number" min="1" max="180" value="10" inputmode="numeric">
      <span class="unit">min</span>
      <button type="submit" class="btn small">Start</button>
    </form>
  </section>

  <script src="data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
